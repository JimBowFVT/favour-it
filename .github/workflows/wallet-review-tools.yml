name: Wallet review tools
on:
  push:
    branches: [fix/wallet-coins-sidebar-continuation]
    paths: [.github/workflows/wallet-review-tools.yml]
permissions:
  contents: read
jobs:
  verification-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Package public dependencies for isolated verification
        run: |
          tar -czf wallet-review-deps.tar.gz node_modules
          curl --fail --location --max-time 30 https://supabase.com/changelog.md > supabase-changelog.md
      - uses: actions/upload-artifact@v4
        with:
          name: wallet-review-tools
          path: |
            wallet-review-deps.tar.gz
            supabase-changelog.md
          retention-days: 1
