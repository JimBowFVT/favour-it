name: Verify and stage completed wallet source
on:
  push:
    branches: [fix/wallet-coins-sidebar-continuation]
    paths: [.github/workflows/wallet-finalize.yml, .github/wallet-stage-a.json, .github/wallet-stage-b.json]
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'JimBowFVT/favour-it' && github.ref == 'refs/heads/fix/wallet-coins-sidebar-continuation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact reviewed deltas against the pinned source checkpoint
        run: |
          python3 - <<'PY'
          import json, hashlib, subprocess
          from pathlib import Path
          base='e58e42f3c4f072dc3874fc887f41b0807ee01c4d'
          seen=set()
          for payload in ['.github/wallet-stage-a.json','.github/wallet-stage-b.json']:
            for change in json.loads(Path(payload).read_text()):
              path=change['path']
              assert path not in seen and '..' not in Path(path).parts
              assert path.startswith(('src/','tests/')) or path in ('.gitignore','.github/workflows/wallet-continuation.yml')
              seen.add(path)
              # The pinned Git object, not advisory transport metadata, is the baseline authority.
              original=subprocess.check_output(['git','show',base+':'+path]).decode('utf-8')
              assert Path(path).read_text()==original, 'Source changed: '+path
              result=original
              for position,length,text in sorted(change['edits'],key=lambda edit:edit[0],reverse=True):
                assert 0 <= position <= len(original) and 0 <= length <= len(original)-position
                result=result[:position]+text+result[position+length:]
              assert hashlib.sha256(result.encode()).hexdigest()==change['after'], 'Reviewed result mismatch: '+path
              Path(path).write_text(result)
          assert len(seen)==25
          for path in ['.github/wallet-stage-a.json','.github/wallet-stage-b.json','.github/workflows/wallet-review-tools.yml','.github/workflows/wallet-finalize.yml']:
            Path(path).unlink(missing_ok=True)
          PY
          git diff --check
      - run: npm ci --no-audit --no-fund
      - name: Wallet core regression
        run: npm run test:wallet 2>&1 | tee wallet-core-final.log
      - name: All React regression tests
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --runInBand 2>&1 | tee wallet-react-final.log
      - name: Strict production compilation
        env:
          CI: 'true'
        run: npm run build 2>&1 | tee wallet-build-final.log
      - name: Stage verified candidate without changing main or the PR head
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs scripts/qa .github .gitignore
          git commit -m 'Complete wallet recovery, account setup, exact balances and strict release build'
          candidate="qa/wallet-${GITHUB_SHA:0:12}"
          git push origin "HEAD:refs/heads/$candidate"
          git rev-parse HEAD > candidate-sha.txt
          printf '%s\n' "$candidate" > candidate-branch.txt
          git archive --format=zip --output=wallet-completed-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallet-completion-candidate
          path: |
            wallet-*-final.log
            candidate-*.txt
            wallet-completed-source.zip
          retention-days: 3
          if-no-files-found: warn
